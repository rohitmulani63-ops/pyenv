# Fork-only temp CI (rohitmulani63-ops/pyenv), never part of a PR.
# Checks the bash-3.2 ERR-trap fix on top of pyenv/pyenv#3637 (e96a4f46).
# Jobs copy upstream pyenv_tests.yml (pyenv_tests on the failing macOS runners + one ubuntu, and pyenv_tests_docker).
name: ci-check-3637-errtrap
on:
  push:
    branches:
      - ci-check-3637-errtrap
permissions:
  contents: read
jobs:
  pyenv_tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install prerequisites
        run: |
          if test "$RUNNER_OS" == "macOS"; then
            brew install coreutils fish parallel
          fi
      - name: Run tests
        run: |
          make test
  pyenv_tests_docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          make test-docker
